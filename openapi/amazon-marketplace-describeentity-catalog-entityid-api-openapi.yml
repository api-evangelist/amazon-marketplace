security:
- hmac: []
tags:
- name: DescribeEntity#catalog&entityId
paths:
  /DescribeEntity#catalog&entityId:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: DescribeEntity
      description: Returns the metadata and content of the entity.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeEntityResponse'
        '480':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ResourceNotSupportedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotSupportedException'
        '484':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '485':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
      parameters:
      - name: catalog
        in: query
        required: true
        description: 'Required. The catalog related to the request. Fixed value: <code>AWSMarketplace</code> '
        schema:
          type: string
          pattern: ^[a-zA-Z]+$
          minLength: 1
          maxLength: 64
      - name: entityId
        in: query
        required: true
        description: Required. The unique ID of the entity to describe.
        schema:
          type: string
          pattern: ^[\w\-]+$
          minLength: 1
          maxLength: 255
      summary: Amazon Marketplace Describe Entity
      tags:
      - DescribeEntity#catalog&entityId
components:
  schemas:
    ValidationException: {}
    DescribeEntityResponse:
      type: object
      properties:
        EntityType:
          allOf:
          - $ref: '#/components/schemas/EntityType'
          - description: The named type of the entity, in the format of <code>EntityType@Version</code>.
        EntityIdentifier:
          allOf:
          - $ref: '#/components/schemas/Identifier'
          - description: The identifier of the entity, in the format of <code>EntityId@RevisionId</code>.
        EntityArn:
          allOf:
          - $ref: '#/components/schemas/ARN'
          - description: The ARN associated to the unique identifier for the entity referenced in this request.
        LastModifiedDate:
          allOf:
          - $ref: '#/components/schemas/DateTimeISO8601'
          - description: The last modified date of the entity, in ISO 8601 format (2018-02-27T13:45:22Z).
        Details:
          allOf:
          - $ref: '#/components/schemas/Json'
          - description: This stringified JSON object includes the details of the entity.
    Identifier:
      type: string
      pattern: ^[\w\-@]+$
      minLength: 1
      maxLength: 255
    AccessDeniedException: {}
    InternalServiceException: {}
    ResourceNotSupportedException: {}
    Json:
      type: string
      pattern: ^[\s]*\{[\s\S]*\}[\s]*$
      minLength: 2
      maxLength: 16384
    ThrottlingException: {}
    EntityType:
      type: string
      pattern: ^[a-zA-Z]+$
      minLength: 1
      maxLength: 255
    DateTimeISO8601:
      type: string
      pattern: ^([\d]{4})\-(1[0-2]|0[1-9])\-(3[01]|0[1-9]|[12][\d])T(2[0-3]|[01][\d]):([0-5][\d]):([0-5][\d])Z$
      minLength: 20
      maxLength: 20
    ARN:
      type: string
      pattern: ^[a-zA-Z0-9:*/-]+$
      minLength: 1
      maxLength: 2048
    ResourceNotFoundException: {}
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
