    - name: amazon-marketplace-get-resource-policy
      description: Amazon Marketplace Get Resource Policy
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-marketplace.getresourcepolicy
      with:
        resourceArn: tools.resourceArn
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-marketplace-list-change-sets
      description: Amazon Marketplace List Change Sets
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: amazon-marketplace.listchangesets
      with:
        MaxResults: tools.MaxResults
        NextToken: tools.NextToken
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-marketplace-list-entities
      description: Amazon Marketplace List Entities
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: amazon-marketplace.listentities
      with:
        MaxResults: tools.MaxResults
