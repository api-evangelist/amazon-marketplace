naftiko: 1.0.0-alpha2
info:
  label: AWS Marketplace Catalog Service
  description: 'AWS Marketplace Catalog Service. 12 operations. Lead operation: Amazon Marketplace Cancel Change Set. Self-contained
    Naftiko capability covering one Amazon Marketplace business surface.'
  tags:
  - Amazon Marketplace
  - AWS Marketplace Catalog Service
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_MARKETPLACE_API_KEY: AMAZON_MARKETPLACE_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-marketplace
    baseUri: http://catalog.marketplace.{region}.amazonaws.com
    description: AWS Marketplace Catalog Service business capability. Self-contained, no shared references.
    resources:
    - name: CancelChangeSet#catalog&changeSetId
      path: /CancelChangeSet#catalog&changeSetId
      operations:
      - name: cancelchangeset
        method: PATCH
        description: Amazon Marketplace Cancel Change Set
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: catalog
          in: query
          type: string
          description: 'Required. The catalog related to the request. Fixed value: <code>AWSMarketplace</code>.'
          required: true
        - name: changeSetId
          in: query
          type: string
          description: Required. The unique identifier of the <code>StartChangeSet</code> request that you want to cancel.
          required: true
    - name: DeleteResourcePolicy#resourceArn
      path: /DeleteResourcePolicy#resourceArn
      operations:
      - name: deleteresourcepolicy
        method: DELETE
        description: Amazon Marketplace Delete Resource Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceArn
          in: query
          type: string
          description: The Amazon Resource Name (ARN) of the Entity resource that is associated with the resource policy.
          required: true
    - name: DescribeChangeSet#catalog&changeSetId
      path: /DescribeChangeSet#catalog&changeSetId
      operations:
      - name: describechangeset
        method: GET
        description: Amazon Marketplace Describe Change Set
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: catalog
          in: query
          type: string
          description: 'Required. The catalog related to the request. Fixed value: <code>AWSMarketplace</code>'
          required: true
        - name: changeSetId
          in: query
          type: string
          description: Required. The unique identifier for the <code>StartChangeSet</code> request that you want to describe
            the details for.
          required: true
    - name: DescribeEntity#catalog&entityId
      path: /DescribeEntity#catalog&entityId
      operations:
      - name: describeentity
        method: GET
        description: Amazon Marketplace Describe Entity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: catalog
          in: query
          type: string
          description: 'Required. The catalog related to the request. Fixed value: <code>AWSMarketplace</code>'
          required: true
        - name: entityId
          in: query
          type: string
          description: Required. The unique ID of the entity to describe.
          required: true
    - name: GetResourcePolicy#resourceArn
      path: /GetResourcePolicy#resourceArn
      operations:
      - name: getresourcepolicy
        method: GET
        description: Amazon Marketplace Get Resource Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceArn
          in: query
          type: string
          description: The Amazon Resource Name (ARN) of the Entity resource that is associated with the resource policy.
          required: true
    - name: ListChangeSets
      path: /ListChangeSets
      operations:
      - name: listchangesets
        method: POST
        description: Amazon Marketplace List Change Sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: MaxResults
          in: query
          type: string
          description: Pagination limit
        - name: NextToken
          in: query
          type: string
          description: Pagination token
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ListEntities
      path: /ListEntities
      operations:
      - name: listentities
        method: POST
        description: Amazon Marketplace List Entities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: MaxResults
          in: query
          type: string
          description: Pagination limit
        - name: NextToken
          in: query
          type: string
          description: Pagination token
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ListTagsForResource
      path: /ListTagsForResource
      operations:
      - name: listtagsforresource
        method: POST
        description: Amazon Marketplace List Tags for Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: PutResourcePolicy
      path: /PutResourcePolicy
      operations:
      - name: putresourcepolicy
        method: POST
        description: Amazon Marketplace Put Resource Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: StartChangeSet
      path: /StartChangeSet
      operations:
      - name: startchangeset
        method: POST
        description: Amazon Marketplace Start Change Set
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: TagResource
      path: /TagResource
      operations:
      - name: tagresource
        method: POST
        description: Amazon Marketplace Tag Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: UntagResource
      path: /UntagResource
      operations:
      - name: untagresource
        method: POST
        description: Amazon Marketplace Untag Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_MARKETPLACE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-marketplace-rest
    port: 8080
    description: REST adapter for AWS Marketplace Catalog Service. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/cancelchangeset-catalog-changesetid
      name: cancelchangeset-catalog-changesetid
      description: REST surface for CancelChangeSet#catalog&changeSetId.
      operations:
      - method: PATCH
        name: cancelchangeset
        description: Amazon Marketplace Cancel Change Set
        call: amazon-marketplace.cancelchangeset
        with:
          catalog: rest.catalog
          changeSetId: rest.changeSetId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deleteresourcepolicy-resourcearn
      name: deleteresourcepolicy-resourcearn
      description: REST surface for DeleteResourcePolicy#resourceArn.
      operations:
      - method: DELETE
        name: deleteresourcepolicy
        description: Amazon Marketplace Delete Resource Policy
        call: amazon-marketplace.deleteresourcepolicy
        with:
          resourceArn: rest.resourceArn
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/describechangeset-catalog-changesetid
      name: describechangeset-catalog-changesetid
      description: REST surface for DescribeChangeSet#catalog&changeSetId.
      operations:
      - method: GET
        name: describechangeset
        description: Amazon Marketplace Describe Change Set
        call: amazon-marketplace.describechangeset
        with:
          catalog: rest.catalog
          changeSetId: rest.changeSetId
