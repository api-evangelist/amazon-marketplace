        - type: object
          mapping: $.
    - path: /v1/describeentity-catalog-entityid
      name: describeentity-catalog-entityid
      description: REST surface for DescribeEntity#catalog&entityId.
      operations:
      - method: GET
        name: describeentity
        description: Amazon Marketplace Describe Entity
        call: amazon-marketplace.describeentity
        with:
          catalog: rest.catalog
          entityId: rest.entityId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/getresourcepolicy-resourcearn
      name: getresourcepolicy-resourcearn
      description: REST surface for GetResourcePolicy#resourceArn.
      operations:
      - method: GET
        name: getresourcepolicy
        description: Amazon Marketplace Get Resource Policy
        call: amazon-marketplace.getresourcepolicy
        with:
          resourceArn: rest.resourceArn
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/listchangesets
      name: listchangesets
      description: REST surface for ListChangeSets.
      operations:
      - method: POST
        name: listchangesets
        description: Amazon Marketplace List Change Sets
        call: amazon-marketplace.listchangesets
        with:
          MaxResults: rest.MaxResults
          NextToken: rest.NextToken
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/listentities
      name: listentities
      description: REST surface for ListEntities.
      operations:
      - method: POST
        name: listentities
        description: Amazon Marketplace List Entities
        call: amazon-marketplace.listentities
        with:
          MaxResults: rest.MaxResults
          NextToken: rest.NextToken
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/listtagsforresource
      name: listtagsforresource
      description: REST surface for ListTagsForResource.
      operations:
      - method: POST
        name: listtagsforresource
        description: Amazon Marketplace List Tags for Resource
        call: amazon-marketplace.listtagsforresource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/putresourcepolicy
      name: putresourcepolicy
      description: REST surface for PutResourcePolicy.
      operations:
      - method: POST
        name: putresourcepolicy
        description: Amazon Marketplace Put Resource Policy
        call: amazon-marketplace.putresourcepolicy
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/startchangeset
      name: startchangeset
      description: REST surface for StartChangeSet.
      operations:
      - method: POST
        name: startchangeset
        description: Amazon Marketplace Start Change Set
        call: amazon-marketplace.startchangeset
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tagresource
      name: tagresource
      description: REST surface for TagResource.
      operations:
      - method: POST
        name: tagresource
        description: Amazon Marketplace Tag Resource
        call: amazon-marketplace.tagresource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/untagresource
      name: untagresource
      description: REST surface for UntagResource.
      operations:
      - method: POST
        name: untagresource
        description: Amazon Marketplace Untag Resource
        call: amazon-marketplace.untagresource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-marketplace-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS Marketplace Catalog Service. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: amazon-marketplace-cancel-change-set
      description: Amazon Marketplace Cancel Change Set
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: amazon-marketplace.cancelchangeset
      with:
        catalog: tools.catalog
        changeSetId: tools.changeSetId
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-marketplace-delete-resource-policy
      description: Amazon Marketplace Delete Resource Policy
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: amazon-marketplace.deleteresourcepolicy
      with:
        resourceArn: tools.resourceArn
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-marketplace-describe-change-set
      description: Amazon Marketplace Describe Change Set
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-marketplace.describechangeset
      with:
        catalog: tools.catalog
        changeSetId: tools.changeSetId
